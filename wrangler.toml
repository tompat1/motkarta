name = "motkarta"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-13"

# Production AI RAG Concierge verified with full D1 catalog & Vectorize index.
[limits]
cpu_ms = 10000

[[d1_databases]]
binding = "DB"
database_name = "motkarta-prod"
database_id = "e9affd7c-51fb-4b73-8cfc-c105a0d136bd"
migrations_dir = "drizzle"

[ai]
binding = "AI"

[[vectorize]]
binding = "CONCIERGE_INDEX"
index_name = "motkarta-concierge-preview-v1"

[[services]]
binding = "CONCIERGE_RATE_GATE"
service = "motkarta-concierge-ai-gate"

[vars]
CONCIERGE_RETRIEVAL_MODE = "hybrid"
CONCIERGE_SYNTHESIS_MODE = "constrained"
CONCIERGE_MIN_SIMILARITY = "0.5"
CONCIERGE_DEADLINE_MS = "10000"
CONCIERGE_ALLOW_UNGUARDED_AI = "true"
MOTKARTA_PUBLIC_SITE_URL = "https://motkarta.rynell.org"
MOTKARTA_CLOUDFLARE_ACCOUNT_ID = "16891d0ac7f5c5aad70c7b2dd0f7f032"

# Pages does not support [triggers] in wrangler.toml. Schedule weekly digest via
# Cloudflare dashboard (Cron Triggers on a Worker) or POST /api/cron/weekly-admin-digest.
