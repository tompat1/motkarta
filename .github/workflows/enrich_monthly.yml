name: Monthly Enrichment

# Runs on the 1st of every month at 04:00 UTC.
# Also triggerable manually via the Actions tab.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  enrich:
    name: Catalog freshness, enrichment & D1 sync
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit enriched files back to main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4
          if [ -f requirements-python.txt ]; then pip install -r requirements-python.txt; fi

      - name: Install Node dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Phase A: Monthly catalog freshness loop
      # 1. Refresh OpenStreetMap baseline (Overpass)
      # 2. Refresh Stockholm municipal food-control records
      # 3. Match food-control facilities and serving permits against the live catalog
      # 4. Compare catalog vs OSM + Google metadata-only discovery
      # 5. Enrich existing catalog venues with neutral Google metadata
      # 6. Rebuild candidate review queue + D1 candidate seed SQL
      # -----------------------------------------------------------------------
      - name: Run monthly catalog freshness loop
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python scripts/run_monthly_catalog_freshness.py

      # -----------------------------------------------------------------------
      # Phase B: Website photo scraping
      # Scrapes og:image / srcset from official venue websites for places that
      # still have no photos after metadata sync. HTTP-validates candidates.
      # -----------------------------------------------------------------------
      - name: Scrape website images for venues still missing photos
        run: python scripts/fetch_place_photos.py --only-missing --validate

      # -----------------------------------------------------------------------
      # Phase C: Catalog enrichment (Phase 1 + Phase 2)
      # Phase 1: Deterministic local extraction (OSM, ground-truth files,
      #          editorial reviews, curated sources).
      # Phase 2 (--scrape): Website scraping for opening hours, price ranges,
      #          atmosphere, dishes, and Wi-Fi text patterns.
      # -----------------------------------------------------------------------
      - name: Run catalog enrichment (local + website scraping)
        # --limit 300: scrapes the top-priority 300 venues per run (sorted by
        # missing must-have data first). Prevents GitHub Actions timeout while
        # still covering all venues over 2-3 monthly runs via the cache.
        run: python execution/enrich_catalog.py --output data/enrichment_overlay.json --scrape --limit 300

      # -----------------------------------------------------------------------
      # Phase D: Apply enrichment overlay into places.json
      # Injects sourceFacts and backfills top-level openingHours / website
      # fields without touching any non-enrichment properties.
      # -----------------------------------------------------------------------
      - name: Apply enrichment overlay to places.json
        run: python execution/apply_enrichment.py

      # -----------------------------------------------------------------------
      # Phase E: Regenerate D1 seed SQL and reconcile catalog audit report
      # -----------------------------------------------------------------------
      - name: Regenerate D1 seed SQL from enriched places.json
        run: node scripts/generate_seed_sql.mjs

      - name: Write monthly catalog reconciliation report
        run: python execution/audit_google_places_monthly.py

      - name: Apply D1 schema migrations (motkarta-prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply motkarta-prod --remote
        continue-on-error: true

      - name: Provision D1 photo tables (motkarta-prod)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute motkarta-prod --remote --file drizzle/0011_public_photo_uploads.sql
        continue-on-error: true

      - name: Re-seed Cloudflare D1 (motkarta-prod) with enriched places
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Requires a custom API token with Account / D1 / Edit (or broader Workers+D1 write).
          npx wrangler d1 execute motkarta-prod --remote --file drizzle/seed-places.sql
        continue-on-error: true  # D1 failure must not block the JSON commit

      - name: Re-seed Cloudflare D1 venue photos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute motkarta-prod --remote --file drizzle/seed-photos.sql
        continue-on-error: true

      - name: Re-seed Cloudflare D1 candidate review queue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute motkarta-prod --remote --file drizzle/seed-candidates.sql
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Phase F: Sync admin review labels into the ML training corpus
      # Records a D1 export checkpoint and writes data/human_validation_labels.json.
      # -----------------------------------------------------------------------
      - name: Sync review labels to ML corpus
        env:
          MOTKARTA_ADMIN_TOKEN: ${{ secrets.MOTKARTA_ADMIN_TOKEN }}
          MOTKARTA_API_URL: https://motkarta.se
        run: npm run sync:labels -- data/human_validation_labels.json
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Phase G: Commit enriched files back to main
      # Uses [skip ci] to prevent triggering the quality gate in a loop.
      # Only commits if any files actually changed.
      # -----------------------------------------------------------------------
      - name: Commit enriched data back to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          safe_git_add() {
            for path in "$@"; do
              if [ ! -e "$path" ]; then
                echo "Skipping missing path: $path"
                continue
              fi
              if git check-ignore -q "$path"; then
                echo "Skipping ignored path: $path"
                continue
              fi
              git add -- "$path"
            done
          }
          safe_git_add \
            public/data/places.json \
            public/data/place_photos.json \
            public/data/enrichment_url_blocklist.json \
            public/data/enrichment_run_report.json \
            public/data/monthly_catalog_reconciliation_report.json \
            public/data/catalog_freshness_report.json \
            data/enrichment_overlay.json \
            data/human_validation_labels.json \
            data/stockholm_food_places.csv \
            data/raw/osm_stockholm_food_places.json \
            data/raw/osm_stockholm_food_places.metadata.json \
            data/raw/stockholm_food_control.json \
            data/raw/stockholm_food_control.metadata.json \
            data/stockholm_food_control.csv \
            data/stockholm_food_control_matches.csv \
            data/serving_permits.csv \
            data/serving_permit_matches.csv \
            drizzle/seed-places.sql \
            drizzle/seed-candidates.sql
          if git diff --cached --quiet; then
            echo "No enrichment changes detected — skipping commit."
          else
            git commit -m "chore(enrich): monthly catalog freshness, enrichment & candidate queue [skip ci]"
            git push origin main
          fi
