name: Weekly admin digest

# Mondays 08:17 UTC. The non-zero minute avoids GitHub's start-of-hour congestion.
# Also runnable from Actions → "Run workflow".
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

jobs:
  send-digest:
    name: Email Motkarta admin digest
    runs-on: ubuntu-latest
    steps:
      - name: Trigger production digest endpoint
        env:
          CRON_SECRET: ${{ secrets.MOTKARTA_CRON_SECRET }}
          DIGEST_URL: ${{ vars.MOTKARTA_DIGEST_URL }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add repository secret MOTKARTA_CRON_SECRET (same value as Cloudflare Pages)."
            exit 1
          fi
          url="${DIGEST_URL:-https://motkarta.pages.dev/api/cron/weekly-admin-digest}"
          curl_args=(
            --silent --show-error --retry 3 --retry-all-errors
            --connect-timeout 15 --max-time 120
            --write-out $'\n%{http_code}'
            --request POST
            --header "Authorization: Bearer $CRON_SECRET"
            --header "x-motkarta-cron-secret: $CRON_SECRET"
            --header "Accept: application/json"
          )
          if [ "$FORCE_DIGEST" = "1" ]; then
            curl_args+=(--header "x-motkarta-digest-force: 1")
          fi
          response="$(curl "${curl_args[@]}" "$url")"
          body="$(printf '%s' "$response" | sed '$d')"
          status="$(printf '%s' "$response" | tail -n 1)"
          echo "$body"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Digest request failed with HTTP $status"
            exit 1
          fi
          if ! outcome="$(printf '%s' "$body" | jq -er '.outcome')"; then
            echo "::error::Response is not the digest API (deploy may be missing /api/cron/weekly-admin-digest). Body starts with:"
            printf '%s' "$body" | head -c 200
            exit 1
          fi
          case "$outcome" in
            sent) echo "Digest accepted for delivery." ;;
            skipped) echo "::notice::Digest skipped by the idempotency/no-work guard." ;;
            *) echo "::error::Digest returned unexpected outcome: $outcome"; exit 1 ;;
          esac
